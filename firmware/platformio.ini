
[platformio]
default_envs = esp32dev

[env:native]
platform = native
test_framework = unity
test_build_src = no
lib_deps =
    bblanchon/ArduinoJson@^7
lib_ignore =
    IMU
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -I include

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7
build_flags =
    -std=gnu++17
    -I include
    -I src/tasks

; Wi-Fi OTA upload. Keep esp32dev above for the initial USB flash.
; Set an alphanumeric ESP32_OTA_PASSWORD in the shell before building/uploading.
[env:esp32dev_ota]
extends = env:esp32dev
upload_protocol = espota
upload_flags =
    --auth=${sysenv.ESP32_OTA_PASSWORD}
build_flags =
    ${env:esp32dev.build_flags}
    -DOTA_PASSWORD=${sysenv.ESP32_OTA_PASSWORD}

; Use this once over USB to install the OTA-enabled firmware.
[env:esp32dev_ota_usb]
extends = env:esp32dev_ota
upload_protocol = esptool
